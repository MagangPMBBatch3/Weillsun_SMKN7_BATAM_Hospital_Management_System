type DetailPembayaranPasien {
    id: ID!
    pembayaran_id: ID!
    kunjungan_id: ID
    rawat_inap_id: ID
    resep_id: ID
    radiologi_id: ID
    lab_id: ID
    jumlah: Int!
    harga_satuan: Float!
    subtotal: Float!
    created_at: DateTime
    updated_at: DateTime
    deleted_at: DateTime

    pembayaranPasien: PembayaranPasien @belongsTo
    resep: ResepObat @belongsTo
    kunjungan: Kunjungan @belongsTo
    rawatInap: RawatInap @belongsTo
    radiologi: Radiologi @belongsTo
    lab: LabPemeriksaan @belongsTo
}

type UnpaidCost {
    id: ID!
    type: String!
    type_label: String!
    description: String!
    jumlah: Int!
    harga_satuan: Float!
    subtotal: Float!
    tanggal: String
}

input CreateDetailPembayaranPasienInput {
    pembayaran_id: ID!
    kunjungan_id: ID
    rawat_inap_id: ID
    resep_id: ID
    radiologi_id: ID
    lab_id: ID
    jumlah: Int!
    harga_satuan: Float!
    subtotal: Float!
}
input UpdateDetailPembayaranPasienInput {
    pembayaran_id: ID!
    kunjungan_id: ID
    rawat_inap_id: ID
    resep_id: ID
    radiologi_id: ID
    lab_id: ID
    jumlah: Int
    harga_satuan: Float
    subtotal: Float
}

type PageInfo {
    hasMorePages: Boolean!
    currentPage: Int!
    lastPage: Int!
    perPage: Int!
    total: Int!
}

type DetailPembayaranPasienPaginator {
    data: [DetailPembayaranPasien!]!
    paginatorInfo: PageInfo!
}

extend type Query {
    allDetailPembayaranPasien: [DetailPembayaranPasien!]!
        @all(
            model: "App\\Models\\DetailPembayaranPasien\\DetailPembayaranPasien"
        )

    allDetailPembayaranPasienPaginate(
        search: String
        page: Int
        first: Int
    ): DetailPembayaranPasienPaginator
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Queries\\DetailPembayaranPasienQuery@all"
        )

    allDetailPembayaranPasienArchive(
        search: String
        page: Int
        first: Int
    ): DetailPembayaranPasienPaginator
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Queries\\DetailPembayaranPasienQuery@allArchive"
        )

    getUnpaidCostsByPasien(pasien_id: ID!): [UnpaidCost!]!
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Queries\\DetailPembayaranPasienQuery@getUnpaidCostsByPasien"
        )

    DetailPembayaranPasien(id: ID! @eq(key: "id")): DetailPembayaranPasien
        @find(
            model: "App\\Models\\DetailPembayaranPasien\\DetailPembayaranPasien"
        )
}

extend type Mutation {
    createDetailPembayaranPasien(
        input: CreateDetailPembayaranPasienInput!
    ): DetailPembayaranPasien
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Mutations\\DetailPembayaranPasienMutation@create"
        )

    updateDetailPembayaranPasien(
        id: ID! @eq(key: "id")
        input: UpdateDetailPembayaranPasienInput! @spread
    ): DetailPembayaranPasien
        @update(
            model: "App\\Models\\DetailPembayaranPasien\\DetailPembayaranPasien"
        )

    deleteDetailPembayaranPasien(
        id: ID! @eq(key: "id")
    ): DetailPembayaranPasien
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Mutations\\DetailPembayaranPasienMutation@delete"
        )

    restoreDetailPembayaranPasien(id: ID!): DetailPembayaranPasien
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Mutations\\DetailPembayaranPasienMutation@restore"
        )

    forceDeleteDetailPembayaranPasien(id: ID!): DetailPembayaranPasien
        @field(
            resolver: "App\\GraphQL\\DetailPembayaranPasien\\Mutations\\DetailPembayaranPasienMutation@forceDelete"
        )
}
